plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vignex.alarmclock'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vignex.alarmclock'
        minSdk 26
        targetSdk 34
        // CI sets GITHUB_RUN_NUMBER so every build can update the previous one.
        versionCode System.getenv('GITHUB_RUN_NUMBER') ? System.getenv('GITHUB_RUN_NUMBER').toInteger() : 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'alarmclock'
            keyAlias 'alarmclock'
            keyPassword 'alarmclock'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
